# Gate-verification spike: the only entry browsers would reach.
# Direct media downloads are refused here; attachments go through the rule service (/af/media).
events {}
http {
  client_max_body_size 50m;
  server {
    listen 127.0.0.1:8080;
    location ~ ^/_matrix/(media/[^/]+|client/v1/media)/(download|thumbnail)/ { return 403; }
    location ~ ^/_synapse/admin/ { return 403; }
    location /af/ { proxy_pass http://127.0.0.1:9100; }
    location / {
      proxy_pass http://127.0.0.1:8008;
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
    }
  }
}
